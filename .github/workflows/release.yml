name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'izo/WoWSilicon-silo'
    runs-on: macos-26

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install Windows helper compiler
        run: brew install mingw-w64

      - name: Restore and validate Wine runtime
        run: tools/wine-runtime/restore.sh --runtime "$GITHUB_WORKSPACE/.wine-runtime"

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          build_number="$(tools/release/version_to_build_number.sh "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: tools/release/set_version.sh "$VERSION" "$BUILD_NUMBER"

      - name: Resolve release notes
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/$VERSION.md"
          if [[ -f "$notes" ]]; then
            echo "file=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "Release notes not found at $notes; using generated placeholder notes."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift test

      - name: Validate Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ruby -rbase64 -e '
            key = ENV.fetch("SPARKLE_PRIVATE_KEY", "")
            abort "SPARKLE_PRIVATE_KEY is empty." if key.empty?
            stripped = key.gsub(/\s+/, "")
            if stripped.include?("SPARKLE_PRIVATE_KEY") || stripped.include?("PRIVATE_KEY") || stripped.include?("SUPublicEDKey") || stripped.include?("<key>") || stripped.include?("<string>")
              abort "SPARKLE_PRIVATE_KEY must be only the exported private key value, not XML, labels, or shell assignment text."
            end
            begin
              decoded = Base64.strict_decode64(stripped)
            rescue ArgumentError
              abort "SPARKLE_PRIVATE_KEY is not valid base64. Re-export it with generate_keys -x and paste only the file contents."
            end
            unless decoded.bytesize == 32
              abort "SPARKLE_PRIVATE_KEY decoded to #{decoded.bytesize} bytes; Sparkle EdDSA private seed exports should decode to 32 bytes."
            end
          '

      - name: Check for existing gh-pages branch
        id: pages_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages branch
        if: steps.pages_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Build DMG and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          EXISTING_APPCAST: ${{ github.workspace }}/pages/appcast.xml
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          make appcast \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            DOWNLOAD_URL_PREFIX="https://github.com/izo/WoWSilicon-silo/releases/download/$TAG/"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg=".build/release-archives/SiloWow-$VERSION.dmg"
          notes=".build/appcast/SiloWow-$VERSION.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
            gh release edit "$TAG" --title "SiloWow $VERSION" --notes-file "$notes"
          else
            gh release create "$TAG" "$dmg" --title "SiloWow $VERSION" --notes-file "$notes"
          fi

      - name: Publish appcast to gh-pages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH_EXISTS: ${{ steps.pages_branch.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_EXISTS" != "true" ]]; then
            mkdir -p pages
            git -C pages init -q
            git -C pages checkout -q --orphan gh-pages
            git -C pages remote add origin "$(git remote get-url origin)"
            git -C pages config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          fi
          cp .build/appcast/appcast.xml pages/appcast.xml
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to publish."
          else
            git commit -m "Update appcast for SiloWow $VERSION"
            git push origin HEAD:gh-pages
          fi
